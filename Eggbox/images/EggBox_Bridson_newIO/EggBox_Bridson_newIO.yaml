DataSet:
- name: df_samples_0
  path: ../../outputs/EggBox_Bridson_newIO/DATABASE/samples.0.csv
  type: csv

Figures:
- name: scatter_x__y
  enable: true
  style:
  - a4paper_2x1
  - rectcmap
  frame:
    ax:
      labels:
        x: x
        y: y
      xlim:
      - 0.1
      - 5.0
      ylim:
      - 0
      - 5.0
      xscale: log
      yscale: linear
    axc:
      label:
        ylabel: LogL
  layers:
  - name: scatter
    data:
    - source: df_samples_0
    axes: ax
    method: scatter
    coordinates:
      x:
        expr: x
      y:
        expr: y
      c:
        expr: LogL
    style:
      marker: .
      s: 2
      cmap: jarvis_rainbow2_r
      norm: linear
      zorder: 1

output:
  dir: .
  dpi: 200
  formats:
  - png

project:
  name: Example_Bridson

version: 0.3

Functions: []
