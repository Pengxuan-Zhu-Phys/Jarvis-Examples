# MultiNest Eggbox scan using a project-local external Calculator and JSON Portal IO.
# CLI sources: Jarvis man sampler.Random --json; Jarvis man example.calculator --json;
#              Jarvis man calculator.execution.{input,output} --type JSON --json
Scan:
  name: "EggBox_MultiNest_Calculator"

Sampling:
  Method: "MultiNest"
  Bounds:
    nlive: 40
    dlogz: 0.5
    run_nested:
      print_progress: true
  Variables:
    - name: x
      description: "Eggbox x coordinate with logarithmic sampling."
      distribution:
        type: Log
        parameters:
          min: 0.1
          max: 5.0
    - name: y
      description: "Eggbox y coordinate with flat sampling."
      distribution:
        type: Flat
        parameters:
          min: 0.0
          max: 5.0
  LogLikelihood:
    - {name: "LogL_Z", expression: "LogGauss(z, 100, 10)"}

EnvReqs:
  Check_default_dependencies:
    required: true
    default_yaml_path: "&J/deps/environment_default.yaml"
  V2:
    workers: 16

Calculators:
  Pools:
    EggBox: 16
  Modules:
    - name: EggBox
      required_modules: []
      clone_shadow: false
      path: "&J/deps/assets/inertial/EggBox"
      execution:
        path: "@Sdir"
        commands:
          - cmd: 'python3 "&J/deps/assets/inertial/EggBox/eggbox.py"'
            cwd: "@Sdir"
        input:
          - name: inpjson
            path: "@Sdir/input.json"
            type: JSON
            actions:
              - type: Dump
                variables:
                  - {name: xx, expression: "x * Pi"}
                  - {name: yy, expression: "y * Pi"}
        output:
          - name: outjson
            path: "@Sdir/output.json"
            type: JSON
            variables:
              - {name: z, entry: z}
