# Jarvis-HEP V2 smoke card — Eggbox MultiNest (quick)
#
# Method: MultiNest → always static NestedSampler (not Fortran MultiNest).
# Compare: bin/Example_Dynesty_Operas_Quick.yaml  (DynamicNestedSampler)
#
# Run from the Eggbox project root:
#   Jarvis2 run bin/Example_MultiNest_Operas_Quick.yaml
#
# Expect under outputs/<scan>/:
#   DATABASE/samples.hdf5
#   DATABASE/multinest_result.csv
#   DATABASE/sampler_summary.json

Scan:
  name: "EggBox_MultiNest_Operas_Quick"

Sampling:
  Method: "MultiNest"            # always static NestedSampler
  Variables:
    - name: xx
      description: "Variable X (Flat) for Eggbox."
      distribution:
        type: Flat
        parameters: {min: 0.0, max: 5.0}
    - name: yy
      description: "Variable Y (Flat) for Eggbox."
      distribution:
        type: Flat
        parameters: {min: 0.0, max: 5.0}

  Bounds:
    seed: 21
    # Laptop smoke: modest nlive; looser dlogz than Dynesty Quick (no dynamic batches).
    nlive: 40
    dlogz: 0.5                   # static NestedSampler evidence stop
    run_nested:
      print_progress: true
      # maxcall: 50000
      # maxiter: 2000

  LogLikelihood:
    - {name: "LogL_Z", expression: "LogGauss(z, 100, 10)"}

EnvReqs:
  OS:
    - name: linux
      version: ">=3.10.0"
    - name: Darwin
      version: ">=10.14"
  Check_default_dependencies:
    required: true
    default_yaml_path: "&J/deps/environment_default.yaml"
  # Keep workers modest for Quick (bucket-lock stampede at live-point init).
  V2:
    workers: 4
    batch_size: 16

Operas:
  Modules:
    - name: EggBox
      operator: "helper.eggbox2d"
      call_mode: call
      required_modules: []
      input:
        - {name: x, expression: "xx * Pi"}
        - {name: y, expression: "yy * Pi"}
      output:
        - {name: z, entry: z}
