# Random Eggbox scan using the released Jarvis-Operas helper.
# CLI sources: Jarvis man sampler.Random --json; Jarvis man operas --json;
#              Jarvis operas info helper.eggbox2d
Scan:
  name: "EggBox_Random_Operas"

Sampling:
  Method: "Random"
  Bounds:
    point_number: 10000
    seed: 0
  Variables:
    - name: x
      description: "Eggbox x coordinate with logarithmic sampling."
      distribution:
        type: Log
        parameters:
          min: 0.1
          max: 5.0
    - name: y
      description: "Eggbox y coordinate with flat sampling."
      distribution:
        type: Flat
        parameters:
          min: 0.0
          max: 5.0
  LogLikelihood:
    - {name: "LogL_Z", expression: "LogGauss(z, 100, 10)"}

EnvReqs:
  Check_default_dependencies:
    required: true
    default_yaml_path: "&J/deps/environment_default.yaml"
  V2:
    workers: 16

Operas:
  Modules:
    - name: EggBox
      operator: "helper.eggbox2d"
      call_mode: call
      required_modules: []
      input:
        - {name: x, expression: "x * Pi"}
        - {name: y, expression: "y * Pi"}
      output:
        - {name: z, entry: z}
