# Jarvis-HEP V2 smoke card — Eggbox Dynesty (quick)
#
# Method: Dynesty → always DynamicNestedSampler.
# Full card: bin/Example_Dynesty_Operas.yaml (larger nlive).
# Static nested: bin/Example_MultiNest_Operas_Quick.yaml
#
# Run from the Eggbox project root:
#   Jarvis2 run bin/Example_Dynesty_Operas_Quick.yaml
#
# Expect under outputs/<scan>/:
#   DATABASE/samples.hdf5
#   DATABASE/dynesty_result.csv
#   DATABASE/sampler_summary.json

Scan:
  name: "EggBox_Dynesty_Operas_Quick"

Sampling:
  Method: "Dynesty"              # always DynamicNestedSampler
  Variables:
    - name: xx
      description: "Variable X (Flat) for Eggbox."
      distribution:
        type: Flat
        parameters: {min: 0.0, max: 5.0}
    - name: yy
      description: "Variable Y (Flat) for Eggbox."
      distribution:
        type: Flat
        parameters: {min: 0.0, max: 5.0}

  Bounds:
    seed: 21
    # Laptop smoke: small nlive; raise for production.
    nlive: 40
    dlogz: 0.001                 # → DynamicNestedSampler dlogz_init
    run_nested:
      print_progress: true
      # maxcall: 2500
      # maxiter: 500

  LogLikelihood:
    - {name: "LogL_Z", expression: "LogGauss(z, 100, 10)"}

EnvReqs:
  OS:
    - name: linux
      version: ">=3.10.0"
    - name: Darwin
      version: ">=10.14"
  Check_default_dependencies:
    required: true
    default_yaml_path: "&J/deps/environment_default.yaml"
  # Light local smoke. Many workers (e.g. 14) all stampede SAMPLE bucket locks
  # at live-point init — use 2–4 for Quick; raise only after a clean smoke.
  V2:
    workers: 4
    batch_size: 16

Operas:
  Modules:
    - name: EggBox
      operator: "helper.eggbox2d"
      call_mode: call
      required_modules: []
      input:
        - {name: x, expression: "xx * Pi"}
        - {name: y, expression: "yy * Pi"}
      output:
        - {name: z, entry: z}
