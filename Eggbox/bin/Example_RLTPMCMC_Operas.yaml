Scan:
  name: "EggBox_RLTPMCMC_Operas"
  save_dir: "&J/outputs"
  sample_directory:
    limit: 200
    width: 6
    archive_samples: true

Sampling:
  Method: "RLTPMCMC"
  Variables:
    - name: x
      description: "Variable X following a Flat distribution for sampling."
      distribution:
        type: Flat
        parameters:
          min: 0
          max: 5.0
    - name: y
      description: "Variable Y following a Flat distribution for sampling."
      distribution:
        type: Flat
        parameters:
          min: 0
          max: 5.0
  Bounds:
    num_chains: 6
    num_iters: 1000
    exchange_interval: 4
    proposal_scales: [0.18, 0.15, 0.12, 0.09, 0.07, 0.05]
    temperature_ladder: [1.0, 1.4, 2.0, 3.0, 4.5, 7.0]
  LogLikelihood:
    - {name: "LogL_Z", expression: "LogGauss(z, 100, 10)"}
  # Set controller: "none" to run the same card as vanilla PT.
  Control:
    controller: "ppo"
    adaptation_mode: "scheduled"
    decision_interval: 2
    smoothing: 0.40
    max_action_magnitude: 0.12
    burnin_iters: 120
    freeze_after_burnin: false
    deterministic_eval: true
    min_proposal_scale: 0.02
    max_proposal_scale: 0.30
  Reward:
    ess_weight: 1.0
    round_trip_weight: 0.6
    swap_weight: 0.4
    discovery_weight: 1.2
    swap_target: 0.25
    discovery_metric: "best_loglike"
  PPO:
    backend: "torch"
    rollout_size: 4
    epochs: 3
    gamma: 0.99
    gae_lambda: 0.95
    clip_ratio: 0.20
    learning_rate: 3.0e-4
    entropy_coef: 1.0e-3
    value_coef: 0.5
    hidden_sizes: [32, 32]
  Diagnostics:
    state_window: 24
    reward_window: 24
    log_interval: 1

EnvReqs:
  OS:
    - name: linux
      version: ">=3.10.0"
    - name: Darwin
      version: ">=10.14"
  Check_default_dependencies:
    required: true
    default_yaml_path: "&J/deps/environment_default.yaml"

Operas:
  make_paraller: 6
  Modules:
    - name: EggBox
      operator: "helper.eggbox2d"
      call_mode: call
      required_modules: []
      input:
        - {name: x, expression: "x"}
        - {name: y, expression: "y"}
      output:
        - {name: z, entry: z}
