# A/B benchmark: thread execution (v1-default path, closest to legacy Jarvis-HEP).
# Compare with Example_Bridson_process.yaml using: Jarvis <file> --benchmark 60
Scan:
  name: "EggBox_Bridson_thread"
  save_dir: "&J/outputs"

Runtime:
  mode: thread
  workers: 14
  batch_size: 1
  Subprocess:
    max_concurrency: 16
    max_pending: 64
    log_policy: logger

Sampling:
  Method: "Bridson"
  Variables:
    - name: x
      description: "Variable X following a Flat distribution for sampling."
      distribution:
        type: Log
        parameters:
          min: 0.1
          max: 5.0
          length: 20

    - name: y
      description: "Variable Y following a Logarithmic distribution for sampling."
      distribution:
        type: Flat
        parameters:
          min: 0
          max: 5.0
          length: 20

  Radius: 1
  MaxAttempt: 30
  LogLikelihood:
    - {name: "LogL_Z", expression: "LogGauss(z, 100, 10)"}

EnvReqs:
  OS:
    - name: linux
      version: ">=3.10.0"
    - name: Darwin
      version: ">=10.0"
  Check_default_dependencies:
    required: True
    default_yaml_path: "&J/deps/environment_default.yaml"

Calculators:
  make_paraller: 16
  path: "&J/calculators/runtime/program"
  Modules:
    - name: EggBox
      required_modules: []
      clone_shadow: True
      path: &eggbox_path "&J/calculators/runtime/program/EggBox/@PackID"
      source: "&J/deps/assets/inertial/EggBox"
      installation:
        - "cp -r ${source}/* ${path}"
      initialization:
        - "cp -r ${source}/input.json ${path}/input.json"
        - "rm -f output.json"
      execution:
        path: *eggbox_path
        commands:
          - "./eggbox.py"
        input:
          - name: inpjson
            path: "&J/calculators/runtime/program/EggBox/@PackID/input.json"
            type: "JSON"
            actions:
              - type: "Dump"
                variables:
                  - {name: "xx", expression: "x * Pi"}
                  - {name: "yy", expression: "y * Pi"}
                  - {name: "cx", expression: "(x + y) * Pi", entry: "test.config.x"}
            save: True
        output:
          - name: oupjson
            path: "&J/calculators/runtime/program/EggBox/@PackID/output.json"
            type: "JSON"
            save: True
            variables:
              - {name: z}

Utils:
  interpolations_1D:
    - name: XenonSD2019
      file: "&J/data/reference/Xenon1T2019SD_p.csv"
      logY: True
      logX: False
      kind: "cubic"
    - name: inter1P
      x_values: [1, 2, 3, 4, 5]
      y_values: [2, 1.8, 1.5, 1.2, 0.8]
      kind: "cubic"