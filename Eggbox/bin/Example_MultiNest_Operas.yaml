# Jarvis-HEP V2 — Eggbox MultiNest (Operas, production-ish)
#
# Static NestedSampler + Redis Workers. For a short laptop smoke use
# bin/Example_MultiNest_Operas_Quick.yaml instead.
#
# Run from the Eggbox project root:
#   Jarvis2 bin/Example_MultiNest_Operas.yaml
#
# Expect under outputs/<scan>/:
#   DATABASE/samples.hdf5
#   DATABASE/multinest_result.csv
#   DATABASE/sampler_summary.json

Scan:
  name: "EggBox_MultiNest_Operas"

Sampling:
  Method: "MultiNest"
  Variables:
    - name: xx
      description: "Variable X (Flat) for Eggbox."
      distribution:
        type: Flat
        parameters:
          min: 0.0
          max: 5.0

    - name: yy
      description: "Variable Y (Flat) for Eggbox."
      distribution:
        type: Flat
        parameters:
          min: 0.0
          max: 5.0

  Bounds:
    # Static NestedSampler only (never DynamicNestedSampler).
    nlive: 400
    seed: 21
    dlogz: 0.5
    run_nested:
      print_progress: true
      # maxcall: 200000

  LogLikelihood:
    - {name: "LogL_Z", expression: "LogGauss(z, 100, 10)"}

  FeedbackReturn:
    mode: minimal
    include_logl: true

EnvReqs:
  OS:
    - name: linux
      version: ">=3.10.0"
    - name: Darwin
      version: ">=10.14"
  Check_default_dependencies:
    required: true
    default_yaml_path: "&J/deps/environment_default.yaml"
  V2:
    workers: 8
    batch_size: 16

Operas:
  Modules:
    - name: EggBox
      operator: "helper.eggbox2d"
      call_mode: call
      required_modules: []
      input:
        - {name: x, expression: "xx * Pi"}
        - {name: y, expression: "yy * Pi"}
      output:
        - {name: z, entry: z}
