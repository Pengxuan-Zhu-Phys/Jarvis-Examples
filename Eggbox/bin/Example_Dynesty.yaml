Scan: 
  name: "EggBox_Dynesty"

Sampling:
  Method: "Dynesty" 
  Variables:
    - name: xx
      description: "Variable X following a Flat distribution for sampling."
      distribution:
        type: Flat
        parameters:
          min: 0
          max: 5.0

    - name: yy
      description: "Variable Y following a Logarithmic distribution for sampling."
      distribution:
        type: Flat
        parameters:
          min: 0
          max: 5.0
  Bounds:
    nlive:  400
    seed:  21
    dlogz:  1.0
    run_nested: 
      print_progress: True
      # maxcall:  40000  
  LogLikelihood: 
    - {name: "LogL_Z",  expression: "LogGauss(z, 100, 10)"}


EnvReqs:
  OS: 
    - name: linux 
      version: ">=3.10.0"
    - name: Darwin
      version: ">=10.14"
  Check_default_dependencies:
    required: true
    default_yaml_path:  "&J/deps/environment_default.yaml"

Operas:
  Modules:
    - name: EggBox
      operator: "helper.eggbox2d"
      call_mode: call
      required_modules: []
      input:
        - {name: x, expression: "xx * Pi"}
        - {name: y, expression: "yy * Pi"}
      output:
        - {name: z, entry: z}
