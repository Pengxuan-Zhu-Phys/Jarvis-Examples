Scan:
  name: "HinoLLP_MuTB@M2B2_SPheno"

Sampling:
  Method: "Bridson"
  Bounds:
    radius: 1
    max_attempt: 30
    max_worker: 12
  Variables:
    - name: Mu
      description: "Variable X following a Flat distribution for sampling."
      distribution:
        type: Flat
        parameters:
          min: 120
          max: 150
          length: 240

    - name: Tb
      description: "Variable Y following a Logarithmic distribution for sampling."
      distribution:
        type: Log
        parameters:
          min: 3
          max: 4
          length: 70.87

  Nuisance:
    method: Profile1D
    variables:
      - name: ratio
        description: "ratio of M2/M1"
        distribution: {type: Flat, parameters: {min: -3, max: -2}}

    log_likelihood:
      - {name: "LogLNP_wN2", expression: "Abs(log(WN2) + 30.3)"}
      - {name: "LogLNP_mN1Penalty", expression: "100.0 * (1 + sign(mN1))/2"}

    target_mode: "min"

    pass_condition:
      - {name: "N1LSP", expression: "Abs(mN1) < Abs(mC1)"}
      - {name: "mN1Plus", expression: "mN1 < 0"}
      - {name: "LLN2", expression: "LogLNP_wN2 < 0.01"}

    max_attempt: 100

  LogLikelihood:
    - {name: "LogL_comp", expression: "-100 * log(abs(mN2) - abs(mN1))"}

EnvReqs:
  OS:
    - name: linux
      version: ">=5.10.0"
    - name: Darwin
      version: ">=10.14"
  Check_default_dependencies:
    required: true
    default_yaml_path: "&J/deps/environment_default.yaml"

Calculators:
  make_parallel: 1
  path: "&J/calculators/spheno"
  Modules:
    - name: SPheno
      required_modules: []
      clone_shadow: true
      path: &spheno_path "&J/calculators/spheno/@PackID"
      source: "&J/deps/program/SPheno"
      installation:
        - "cp -R ${source}/. ${path}"
        - "make -C ${path} F90=gfortran"
      initialization:
        - "cp ${source}/input/LesHouches.in.lowMSSM_HinoLLP ${path}/input/LesHouches.in.lowMSSM_HinoLLP"
        - "rm -f ${path}/input/SPheno.spc ${path}/input/Messages.out"
      execution:
        path: *spheno_path
        commands:
          - "cd input && ../bin/SPheno LesHouches.in.lowMSSM_HinoLLP SPheno.spc"
        input:
          - name: spheno_input
            path: "&J/calculators/spheno/@PackID/input/LesHouches.in.lowMSSM_HinoLLP"
            type: "SLHA"
            actions:
              - type: "Replace"
                variables:
                  - {name: "Mu", placeholder: ">>>>>Mu<<<<<"}
                  - {name: "Tb", placeholder: ">>>>>Tb<<<<<"}
                  - {name: "M1", placeholder: ">>>>>M1<<<<<", expression: "1.500000E+03"}
                  - {name: "M2", placeholder: ">>>>>M2<<<<<", expression: "1.500000E+03 * ratio"}
            save: true
        output:
          - name: spheno_output
            path: "&J/calculators/spheno/@PackID/input/SPheno.spc"
            type: "SLHA"
            save: true
            variables:
              - {name: mN1, block: MASS, entry: 1000022}
              - {name: mN2, block: MASS, entry: 1000023}
              - {name: mC1, block: MASS, entry: 1000024}
              - {name: WC1, block: DECAY, entry: 1000024}
              - {name: WN2, block: DECAY, entry: 1000023}
              - {name: BRN22N1a, block: DECAY, entry: [1000023, 1000022, 22]}
              - {name: mh1, block: MASS, entry: 25}

Utils:
  interpolations_1D:
    - name: XenonSD2019
      file: "&J/data/reference/Xenon1T2019SD_p.csv"
      logY: true
      logX: false
      kind: "cubic"
    - name: inter1P
      x_values: [1, 2, 3, 4, 5]
      y_values: [2, 1.8, 1.5, 1.2, 0.8]
      kind: "cubic"
