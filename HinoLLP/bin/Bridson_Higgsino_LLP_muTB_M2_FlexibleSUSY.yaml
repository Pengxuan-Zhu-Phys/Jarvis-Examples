Scan:
  name: "HinoLLP_MuTB@M2B2_FlexibleSUSY"
  save_dir: "&J/outputs"

Sampling:
  Method: "Bridson"
  Variables:
    - name: Mu
      description: "Higgsino mass parameter."
      distribution:
        type: Flat
        parameters:
          min: 120
          max: 150
          length: 240

    - name: Tb
      description: "tan(beta)."
      distribution:
        type: Log
        parameters:
          min: 3
          max: 4
          length: 70.87

  Nuisance:
    Method: Profile1D
    Variables:
      - name: ratio
        description: "ratio of M2/M1"
        distribution: {type: Flat, parameters: {min: -3, max: -2}}

    LogLikelihood:
      - {name: "LogLNP_mass_gap", expression: "Abs(Abs(mN2) - Abs(mN1))"}
      - {name: "LogLNP_mN1Penalty", expression: "100.0 * (1 + sign(mN1))/2"}

    TargetMode: "min"

    PassCondition:
      - {name: "N1LSP", expression: "Abs(mN1) < Abs(mC1)"}
      - {name: "mN1Plus", expression: "mN1 < 0"}
      - {name: "CompressedN12", expression: "LogLNP_mass_gap < 10.0"}

    MaxAttempt: 100

  Radius: 1
  MaxAttempt: 30
  MaxWorker: 12
  LogLikelihood:
    - {name: "LogL_comp", expression: "-100 * log(abs(mN2) - abs(mN1))"}

EnvReqs:
  OS:
    - name: linux
      version: ">=5.10.0"
    - name: Darwin
      version: ">=10.14"
  Check_default_dependencies:
    required: true
    default_yaml_path: "&J/deps/environment_default.yaml"

LibDeps:
  path: "&J/deps/library"
  make_paraller: 4
  Modules:
    - name: FlexibleSUSY-lowMSSM
      required_modules: []
      installed: false
      installation:
        path: "&J/deps/library/FlexibleSUSY-lowMSSM"
        source: "&J/deps/program/FlexibleSUSY"
        commands:
          - "sh ${source}/jarvis_build_lowMSSM_once.sh ${source} ${path} ${LibDeps:make_paraller}"

Calculators:
  make_paraller: 4
  path: "&J/calculators/flexiblesusy"
  Modules:
    - name: FlexibleSUSY
      required_modules: []
      clone_shadow: true
      path: &flexiblesusy_path "&J/calculators/flexiblesusy/@PackID"
      source: "&J/deps/program/FlexibleSUSY"
      installation:
        - "mkdir -p ${path}/model_files/lowMSSM"
      initialization:
        - "mkdir -p ${path}/model_files/lowMSSM"
        - "cp ${source}/model_files/lowMSSM/LesHouches.in.lowMSSM_HinoLLP ${path}/model_files/lowMSSM/LesHouches.in.lowMSSM_HinoLLP"
        - "rm -f ${path}/model_files/lowMSSM/LesHouches.out.lowMSSM"
      execution:
        path: *flexiblesusy_path
        commands:
          - "${LibDeps:path}/FlexibleSUSY-lowMSSM/models/lowMSSM/run_lowMSSM.x --slha-input-file=model_files/lowMSSM/LesHouches.in.lowMSSM_HinoLLP --slha-output-file=model_files/lowMSSM/LesHouches.out.lowMSSM"
        input:
          - name: flexiblesusy_input
            path: "&J/calculators/flexiblesusy/@PackID/model_files/lowMSSM/LesHouches.in.lowMSSM_HinoLLP"
            type: "SLHA"
            actions:
              - type: "Replace"
                variables:
                  - {name: "Mu", placeholder: ">>>>>Mu<<<<<"}
                  - {name: "Tb", placeholder: ">>>>>Tb<<<<<"}
                  - {name: "M1", placeholder: ">>>>>M1<<<<<", expression: "1.500000E+03"}
                  - {name: "M2", placeholder: ">>>>>M2<<<<<", expression: "1.500000E+03 * ratio"}
                  - {name: "BMu", placeholder: ">>>>>BMu<<<<<", expression: "1.000000E+06 * Tb / (1 + Tb**2)"}
            save: true
        output:
          - name: flexiblesusy_output
            path: "&J/calculators/flexiblesusy/@PackID/model_files/lowMSSM/LesHouches.out.lowMSSM"
            type: "SLHA"
            save: true
            variables:
              - {name: mN1, block: MASS, entry: 1000022}
              - {name: mN2, block: MASS, entry: 1000023}
              - {name: mN3, block: MASS, entry: 1000025}
              - {name: mN4, block: MASS, entry: 1000035}
              - {name: mC1, block: MASS, entry: 1000024}
              - {name: mC2, block: MASS, entry: 1000037}
              - {name: mh1, block: MASS, entry: 25}

Utils:
  interpolations_1D:
    - name: XenonSD2019
      file: "&J/data/reference/Xenon1T2019SD_p.csv"
      logY: true
      logX: false
      kind: "cubic"
    - name: inter1P
      x_values: [1, 2, 3, 4, 5]
      y_values: [2, 1.8, 1.5, 1.2, 0.8]
      kind: "cubic"
