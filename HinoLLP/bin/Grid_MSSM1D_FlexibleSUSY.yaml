Scan:
  name: "FlexibleSUSYtest"

Sampling:
  Method: "Grid"
  Variables:
    - name: M1
      description: "Bino mass parameter."
      distribution:
        type: Flat
        # parameters: {min: -800, max: -550, num: 2000}
        parameters: {min: -650, max: -640, num: 476}
    # - name: M2
    #   description: "Wino mass parameter."
    #   distribution:
    #     type: Flat
    #     parameters: {min: -4500, max: -3000, num: 5}
    # - name: Mu
    #   description: "Higgsino mass parameter."
    #   distribution:
    #     type: Flat
    #     parameters: {min: 120, max: 150, num: 5}
    # - name: Tb
    #   description: "tan(beta)."
    #   distribution:
    #     type: Flat
    #     parameters: {min: 3, max: 4, num: 5}

EnvReqs:
  OS:
    - name: linux
      version: ">=5.10.0"
    - name: Darwin
      version: ">=10.14"
  Check_default_dependencies:
    required: true
    default_yaml_path: "&J/deps/environment_default.yaml"

LibDeps:
  path: "&J/deps/library"
  make_parallel: 4
  Modules:
    - name: FlexibleSUSY-lowMSSM
      required_modules: []
      installed: false
      installation:
        path: "&J/deps/library/FlexibleSUSY-lowMSSM"
        source: "&J/deps/program/FlexibleSUSY"
        commands:
          - "sh ${source}/jarvis_build_lowMSSM_once.sh ${source} ${path} ${LibDeps:make_parallel}"

Calculators:
  make_parallel: 4
  path: "&J/calculators/flexiblesusy"
  Modules:
    - name: FlexibleSUSY
      required_modules: []
      clone_shadow: true
      path: "&J/calculators/flexiblesusy/@PackID"
      source: "&J/deps/program/FlexibleSUSY"
      installation:
        - "mkdir -p ${path}/model_files/lowMSSM"
      initialization:
        - "mkdir -p ${path}/model_files/lowMSSM"
        - "cp ${source}/model_files/lowMSSM/LesHouches.in.lowMSSM_HinoLLP ${path}/model_files/lowMSSM/LesHouches.in.lowMSSM_HinoLLP"
        - "rm -f ${path}/model_files/lowMSSM/LesHouches.out.lowMSSM"
      execution:
        path: "&J/calculators/flexiblesusy/@PackID"
        commands:
          - "${LibDeps:path}/FlexibleSUSY-lowMSSM/models/lowMSSM/run_lowMSSM.x --slha-input-file=model_files/lowMSSM/LesHouches.in.lowMSSM_HinoLLP --slha-output-file=model_files/lowMSSM/LesHouches.out.lowMSSM"
        input:
          - name: flexip 
            path: "&J/calculators/flexiblesusy/@PackID/model_files/lowMSSM/LesHouches.in.lowMSSM_HinoLLP"
            type: "SLHA"
            actions:
              - type: "Replace"
                variables:
                  - {name: "M1", placeholder: ">>>>>M1<<<<<"}
                  - {name: "M2", placeholder: ">>>>>M2<<<<<", expression: "2000"}
                  - {name: "Mu", placeholder: ">>>>>Mu<<<<<", expression: "100"}
                  - {name: "Tb", placeholder: ">>>>>Tb<<<<<", expression: "7"}
                  - {name: "BMu", placeholder: ">>>>>BMu<<<<<", expression: "5.0E+05 * 14/(1 + 49)"}
                  # - {name: "BMu", placeholder: ">>>>>BMu<<<<<", expression: "5.0E+05 * 2*Tb/(1 + Tb**2)"}
            save: true
        output:
          - name: flexop 
            path: "&J/calculators/flexiblesusy/@PackID/model_files/lowMSSM/LesHouches.out.lowMSSM"
            type: "SLHA"
            save: true
            variables:
              - {name: mN1, block: MASS, entry: 1000022}
              - {name: mN2, block: MASS, entry: 1000023}
              - {name: mN3, block: MASS, entry: 1000025}
              - {name: mN4, block: MASS, entry: 1000035}
              - {name: mC1, block: MASS, entry: 1000024}
              - {name: mC2, block: MASS, entry: 1000037}
              - { name: mh1,          block: MASS,    entry: 25 }

    - name: SDECAY
      required_modules: [FlexibleSUSY]
      clone_shadow: true
      path: "&J/calculators/sdecay/@PackID"
      source: "&J/deps/program/susyhit"
      installation:
        - "cp ${source}/susyhit.tar.gz ${path}"
        - "cd ${path}"
        - "tar -zxvf susyhit.tar.gz"
        - "make"
      initialization:
        - "cp ${source}/susyhit.in.dk ${path}/susyhit.in"
        - "cp ${source}/slhaspectrum.in ${path}/slhaspectrum.in"
        - "cp ${source}/prepare_sdecay_input.py ${path}/prepare_sdecay_input.py"
        - "rm -f ${path}/flexiblesusy_spectrum.in ${path}/susyhit_slha.out"
        - "touch ${path}/flexiblesusy_spectrum.in"
      execution:
        path: "&J/calculators/sdecay/@PackID"
        commands:
          - "python3 prepare_sdecay_input.py slhaspectrum.in flexiblesusy_spectrum.in"
          - "./run"
        input:
          - name: sdecayip
            path: "&J/calculators/sdecay/@PackID/flexiblesusy_spectrum.in"
            type: "SLHA"
            actions:
              - type: "File"
                source: flexop
            save: false
        output:
          - name: sdecay_output
            path: "&J/calculators/sdecay/@PackID/susyhit_slha.out"
            type: "SLHA"
            save: true
            variables:
              - { name: WC1,      block: DECAY, entry: 1000024 }
              - { name: WN2,      block: DECAY, entry: 1000023 }
              - { name: BRN22N1a, block: DECAY, entry: [1000023, 1000022, 22] }
