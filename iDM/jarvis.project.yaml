project:
  format: jarvis-hep-standalone-project
  version: 1
  output_root: outputs
  artifact_roots:
    outputs: outputs
    logs: logs
    images: images
    checkpoints: checkpoints
  path_markers:
    task_root: '&J'
  defaults:
    main_config: bin/quickstart_mcmc_operas.yaml

# Packaging policy for the public/shareable iDM project archive.  The generic
# Jarvis packer reads this project-local block; other projects are unaffected.
pack:
  exclude:
    - deps/models/
  share:
    exclude:
      - bin/
    include:
      - bin/iDM_Axial_AdaptiveBridson_Omega.yaml
      - bin/iDM_Vector_AdaptiveBridson_Omega.yaml
