Scan: 
  name: "iDM_Bridson"

Sampling:
  Method: "Bridson" 
  Bounds:
    radius: 1
    max_attempt: 30
  Variables:
    # - name: MAd
    #   description: "Variable mAd following a Flat distribution for sampling."
    #   distribution:
    #     type: Flat
    #     parameters:
    #       min: 0.1
    #       max: 5.0
    #       length: 100

    - name: MChi
      description: "Variable mChi following a Flat distribution for sampling."
      distribution:
        type: Flat
        parameters:
          min: 100
          max: 1000
          length: 100

    # - name: DeltaM
    #   description: "Variable DeltaM following a Flat distribution for sampling."
    #   distribution:
    #     type: Flat
    #     parameters:
    #       min: 0
    #       max: 5.0
    #       length: 100

    # - name: Epsilon
    #   description: "Variable Epsilon following a Flat distribution for sampling."
    #   distribution:
    #     type: Flat
    #     parameters:
    #       min: 0
    #       max: 5.0
    #       length: 100

    - name: GChi
      description: "Variable GChi following a Flat distribution for sampling."
      distribution:
        type: Log
        parameters:
          min: 0.0001
          max: 10.0
          length: 100

  LogLikelihood: 
    - {name: "LogL_Z",  expression: "LogGauss(z, 100, 10)"}

EnvReqs:
  OS: 
    - name: linux 
      version: ">=3.10.0"
    - name: Darwin
      version: ">=10.0"
  Check_default_dependencies:
    required: True 
    default_yaml_path:  "&J/deps/environment_default.yaml"

Calculators:
  Pools:
    MicroOMEGAs: 16
  path: "&J/calculators"
  Modules:
    - name: MicroOMEGAs 
      required_modules: [] 
      clone_shadow: True
      path: &microomegas_path "&J/calculators/microOMEGAs/@PackID"  # Define Anchor point
      source: "&J/deps/microOMEGAs"
      installation:
          - "mkdir -p ${path}"
          - "cp -R ${source}/. ${path}"
          - "cd ${path}/vector-iDM && make clean && make main=main.cpp"
      initialization:
          - "rm -f ${path}/vector-iDM/output.json"
      execution:
        path: "&J/calculators/microOMEGAs/@PackID/vector-iDM"
        commands:
          - "./main input.json output.json"
        input:
          - name: inpjson
            path: "&J/calculators/microOMEGAs/@PackID/vector-iDM/input.json"
            type: "JSON"
            actions:
              - type: "Dump"
                variables:
                  - { name: "mDM", expression: "MChi" }
                  - { name: "MAD", expression: "1000.0" }
                  - { name: "deltaM", expression: "0.1" }
                  - { name: "gchiD", expression: "GChi" }
                  - { name: "epsilon", expression: "0.01" }
            save: True
        output:
          - name: oupjson
            path: "&J/calculators/microOMEGAs/@PackID/vector-iDM/output.json"
            type: "JSON"
            save: True
            variables:
              - {name: Omega_h2, entry: "relicDensity.Omega_h2"}
              - {name: Xf, entry: "relicDensity.Xf"}
              - {name: sigma_v_cm3_per_s, entry: "indirectDetection.sigmaV_cm3_s"}
              - {name: SIp_pb, entry: "directDetection.crossSections.elastic.protonSI_pb"}
              - {name: SDp_pb, entry: "directDetection.crossSections.elastic.protonSD_pb"}
              - {name: SIn_pb, entry: "directDetection.crossSections.elastic.neutronSI_pb"}
              - {name: SDn_pb, entry: "directDetection.crossSections.elastic.neutronSD_pb"}
