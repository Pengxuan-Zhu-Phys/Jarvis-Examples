# =============================================================================
# iDM Axial — AdaptiveBridson (2D relic-density contour densify)
# =============================================================================
# Same AdaptiveBridson settings as iDM_Vector_AdaptiveBridson_Omega.yaml;
# calculator model is axial-iDM instead of vector-iDM.
#
# Design (full flow): Jarvis-Books/Jarvis-HEP V2/DESIGN_ADAPTIVE_BRIDSON_LIVE_BAND.md
# YAML recipes:       Jarvis-Books/Jarvis-HEP V2/YAML-Example/ADAPTIVE_BRIDSON.md
#
# From the iDM project root:
#   Jarvis run bin/iDM_Axial_AdaptiveBridson_Omega.yaml
#   Jarvis convert bin/iDM_Axial_AdaptiveBridson_Omega.yaml
#
# Products (under outputs/<Scan.name>/):
#   DATABASE/samples.hdf5  (+ samples.csv via convert)
#   levelset.json  (algorithm: outer_core_root_correction_bridson)
#   SAMPLE/…  (calculator shadows when save: true)
# =============================================================================

Scan:
  name: "iDM_Axial_AdaptiveBridson_OmegaV7"

Sampling:
  Method: "AdaptiveBridson"

  # Figure-aligned 2D parameter plane (u-space Bridson; Log map for both axes):
  # y = epsilon^2 * alpha_D * (mDM / MAD)^4.
  Variables:
    - name: MChi
      description: "Dark-matter mass mDM [GeV]."
      distribution:
        type: Log
        parameters: {min: 0.1, max: 100.0, length: 100}
    - name: Y
      description: "Dimensionless y = epsilon^2 alpha_D (mDM/MAD)^4."
      distribution:
        type: Log
        parameters: {min: 1.0e-10, max: 1.0e-3, length: 100}

  # Live-band densify on relic density (Planck: Omega h^2 = 0.1200 ± 0.0012).
  Bounds:
    seed: 21
    target_expression: "Omega_h2"
    target_value: 0.12

    # Public tuning is intentionally limited to these controls.
    initial_radius: 0.03          # initial u-space Bridson radius
    outer_half_width: 0.02        # discovery support: |Ω−T| ≤ 0.02
    min_radius: 0.002             # u-space Euclidean floor = 1/500

    # Internally derived/defaulted:
    # core_half_width = threshold = outer_half_width / 8 = 0.0025;
    # shrink×0.5 on coverage, bridge on, endpoint annulus [1,2.5]r_g;
    # max_generations=16, max_points=50000, max_new/pass=4000, k_ref=30.

  # The kinetic-field redefinition requires epsilon^2 < cos(theta_W)^2.
  # With R=3 and alpha_D=0.1 this excludes only the endpoint y >= 9.6e-4.
  # selection: "Y < 9.5e-4"

  LogLikelihood:
    # Soft preference near the band (optional; AdaptiveBridson uses Omega_h2).
    - {name: "LogL_Omega", expression: "LogGauss(Omega_h2, 0.1200, 0.0012)"}

EnvReqs:
  Check_default_dependencies:
    required: true
    default_yaml_path: "&J/deps/environment_default.yaml"
  V2:
    # Modest pool: AdaptiveBridson is feedback-driven (batch per generation).
    workers: 8
    batch_size: 32

Calculators:
  Pools:
    MicroOMEGAs: 8
  path: "&J/calculators"
  Modules:
    - name: MicroOMEGAs
      required_modules: []
      clone_shadow: true
      path: "&J/calculators/microOMEGAs/@PackID"
      source: "&J/deps/microOMEGAs"
      installation:
        - "mkdir -p ${path}"
        - "cp -R ${source}/. ${path}"
        - "make"
        - "cd vector-iDM"
        - "make main=main.cpp"
        - "cd .."
        - "cd Axial-iDM"
        - "make main=main.cpp"
      initialization:
        - "rm -f ${path}/Axial-iDM/output.json"
      execution:
        path: "&J/calculators/microOMEGAs/@PackID/Axial-iDM"
        commands:
          - "./main input.json output.json"
        input:
          - name: inpjson
            path: "&J/calculators/microOMEGAs/@PackID/Axial-iDM/input.json"
            type: JSON
            actions:
              - type: Dump
                variables:
                  - {name: mDM, expression: "MChi"}
                  # R = MAD/mDM = 3, Delta_m = (mDS-mDM)/mDM = 0.1,
                  # and alpha_D = gchiD^2/(4*pi) = 0.1.
                  - {name: MAD, expression: "3.0*MChi"}
                  - {name: deltaM, expression: "0.1"}
                  - {name: gchiD, expression: "1.1209982432795857"}
                  - {name: epsilon, expression: "sqrt(810.0*Y)"}
            save: true
        output:
          - name: oupjson
            path: "&J/calculators/microOMEGAs/@PackID/Axial-iDM/output.json"
            type: JSON
            save: true
            variables:
              - {name: Omega_h2, entry: "relicDensity.Omega_h2"}
              - {name: Xf, entry: "relicDensity.Xf"}
              - {name: sigma_v_cm3_per_s, entry: "indirectDetection.sigmaV_cm3_s"}
              - {name: SIp_pb, entry: "directDetection.crossSections.elastic.protonSI_pb"}
              - {name: SDp_pb, entry: "directDetection.crossSections.elastic.protonSD_pb"}
              - {name: SIn_pb, entry: "directDetection.crossSections.elastic.neutronSI_pb"}
              - {name: SDn_pb, entry: "directDetection.crossSections.elastic.neutronSD_pb"}
